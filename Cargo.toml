[package]
name = "ruoyi-rust-by"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "RuoYi Vue admin with an Axum Rust backend and MySQL"
repository = "https://github.com/touensan/ruoyi-rust-by"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "chrono", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
bcrypt = "0.17"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
font8x8 = "0.3"
zip = { version = "4", default-features = false, features = ["deflate"] }
sysinfo = "0.38"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
